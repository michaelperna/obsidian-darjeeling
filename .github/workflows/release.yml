name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python 3.10
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Run test suite
        run: npm test

      - name: Build plugin assets
        run: npm run build

      - name: Install Python dependencies & test server
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r server/requirements.lock
          pip install pytest pyflakes
          pyflakes server/
          pytest -v tests/server/

      - name: Verify tag matches manifest, versions.json and server/VERSION
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "FAIL: manifest.json ($MANIFEST) does not match release tag ($TAG)"
            exit 1
          fi
          node -e "
            const v = require('./versions.json');
            if (!v['$TAG']) {
              console.error('FAIL: versions.json does not contain tag $TAG');
              process.exit(1);
            }
          "
          SERVER_VERSION="$(tr -d '[:space:]' < server/VERSION)"
          if [ "$SERVER_VERSION" != "$TAG" ]; then
            echo "FAIL: server/VERSION ($SERVER_VERSION) does not match release tag ($TAG)"
            exit 1
          fi

      - name: Build server tarball and stamp installer (reproducible)
        run: |
          TAG="${GITHUB_REF_NAME}"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./scripts/release/build-server-tarball.sh "$TAG"
          FIRST="$(sha256sum "dist/darjeeling-server-${TAG}.tar.gz" | awk '{print $1}')"
          # Build again from the same commit; the bytes must not change.
          ./scripts/release/build-server-tarball.sh "$TAG"
          SECOND="$(sha256sum "dist/darjeeling-server-${TAG}.tar.gz" | awk '{print $1}')"
          if [ "$FIRST" != "$SECOND" ]; then
            echo "FAIL: server tarball is not reproducible ($FIRST != $SECOND)"
            exit 1
          fi
          grep -q "^DJ_VERSION=\"${TAG}\"$" dist/install.sh
          grep -q "^TARBALL_SHA256=\"${SECOND}\"$" dist/install.sh
          tar -xzOf "dist/darjeeling-server-${TAG}.tar.gz" VERSION | grep -qx "${TAG}"

      - name: Stage release assets and generate SHA256SUMS
        run: |
          TAG="${GITHUB_REF_NAME}"
          rm -rf release-assets
          mkdir release-assets
          # Obsidian installs plugins from these three files at the release root.
          cp main.js manifest.json styles.css release-assets/
          cp "dist/darjeeling-server-${TAG}.tar.gz" dist/install.sh release-assets/
          cd release-assets
          sha256sum main.js manifest.json styles.css "darjeeling-server-${TAG}.tar.gz" install.sh > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
            release-assets/darjeeling-server-${{ github.ref_name }}.tar.gz
            release-assets/install.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          draft: false
          files: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
            release-assets/darjeeling-server-${{ github.ref_name }}.tar.gz
            release-assets/install.sh
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
