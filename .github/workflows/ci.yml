name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check (tsc)
        run: npx --no-install tsc --noEmit

      - name: ESLint ratchet check
        run: node scripts/ci/lint-ratchet.mjs

      - name: Run plugin tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Check manifest
        run: node scripts/lab/lib/check-manifest.cjs .

      - name: CSS Lint
        run: node scripts/ci/css-lint.mjs

      - name: Scrub guard self-test
        run: ./scripts/ci/scrub-guard.sh --self-test

      - name: Scrub guard tree scan
        run: ./scripts/ci/scrub-guard.sh

      - name: Egress audit
        run: ./scripts/ci/egress-audit.sh --report

      - name: Bundle size check
        run: node scripts/ci/bundle-size.mjs

      - name: Two-build reproducibility check
        run: |
          cp main.js main.js.first
          npm run build
          cmp -s main.js.first main.js || (echo "FAIL: main.js is not reproducible across builds" && exit 1)
          rm -f main.js.first

  server:
    name: Server (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r server/requirements.lock
          pip install pytest pyflakes

      - name: Pyflakes check
        run: pyflakes server/

      - name: Run server tests
        run: pytest -v tests/server/

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run shellcheck
        run: |
          shfiles=()
          while IFS= read -r f; do
            case "$f" in
              *.sh) shfiles+=("$f") ;;
              *) if head -n 1 "$f" 2>/dev/null | grep -qE '^#!.*\b(bash|sh)\b'; then shfiles+=("$f"); fi ;;
            esac
          done < <(find . -path ./.git -prune -o -path ./node_modules -prune -o -path ./_lab -prune -o -type f -print)
          if [ ${#shfiles[@]} -gt 0 ]; then
            shellcheck -x -S warning "${shfiles[@]}"
          fi
