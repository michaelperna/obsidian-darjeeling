# Project Darjeeling tmux configuration
# Managed by /opt/darjeeling/current/tmux.conf
# Used exclusively with socket label: tmux -L darjeeling -f /opt/darjeeling/current/tmux.conf

set -g mouse on
set -g history-limit 100000
set -g exit-empty off
set -g status-left "[darjeeling] "
set -g status-right "%Y-%m-%d %H:%M"
set -g default-terminal "screen-256color"
